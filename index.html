<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Puzzle de paysages : reconstitue l'image en déplaçant les carrés.">
<title>Paysages en pièces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the puzzle sits in a postcard frame as the hero; controls stack beneath it on phones and move to a side panel on wide screens */
:root{
  --bg:#e4eaed;
  --paper:#fbfcfc;
  --ink:#15232b;
  --muted:#55656d;
  --line:#c9d4d9;
  --accent:#e2a221;
  --accent-ink:#1d1604;
  --pine:#2b7a5b;
  --well:#24323a;
  --seam:rgba(255,255,255,.4);
  --glass:rgba(251,252,252,.94);
  --shadow:rgba(21,35,43,.2);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e161a; --paper:#18242a; --ink:#e3eaec; --muted:#93a3aa; --line:#2a3a41;
    --accent:#e9b140; --accent-ink:#1d1604; --pine:#57b791; --well:#090f12;
    --seam:rgba(255,255,255,.26); --glass:rgba(24,36,42,.94); --shadow:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e161a; --paper:#18242a; --ink:#e3eaec; --muted:#93a3aa; --line:#2a3a41;
  --accent:#e9b140; --accent-ink:#1d1604; --pine:#57b791; --well:#090f12;
  --seam:rgba(255,255,255,.26); --glass:rgba(24,36,42,.94); --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px;-webkit-font-smoothing:antialiased}
button,input,label{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.app{--img:none;max-width:980px;margin-inline:auto;display:grid;gap:16px}

/* Header */
.top{display:flex;gap:14px;align-items:flex-start}
.mark{flex:0 0 auto;width:40px;height:40px;margin-top:3px}
.mark .m-ink{fill:var(--ink)}
.mark .m-acc{fill:var(--accent)}
.top h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2.3rem,8vw,3.6rem);line-height:.9;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
.top p{margin:.5rem 0 0;color:var(--muted);max-width:58ch;font-size:.95rem}

/* Scene picker */
.scenes{position:relative;display:flex;gap:4px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:grid;justify-items:center;align-content:start;gap:6px;width:84px;padding:6px 2px;border:0;border-radius:8px;background:none;cursor:pointer;scroll-snap-align:start;color:var(--muted);font-size:.76rem;font-weight:500;line-height:1.2;text-align:center}
.chip canvas,.chip .ph{display:block;width:64px;height:64px;border-radius:5px;background:var(--well);box-shadow:0 0 0 1px var(--line);transition:box-shadow .2s}
.chip:hover canvas{box-shadow:0 0 0 1px var(--muted)}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:600}
.chip[aria-pressed="true"] canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.chip.add .ph{display:grid;place-items:center;background:transparent;box-shadow:none;border:1.5px dashed var(--muted);color:var(--muted)}
.chip.add .ph svg{width:22px;height:22px}
#photo:focus-visible + .add{outline:2px solid var(--accent)}
.note{margin:0;color:var(--muted);font-size:.85rem}

/* Play area */
.play{display:grid;gap:18px;align-items:start}
@media (min-width:860px){.play{grid-template-columns:minmax(0,1fr) 300px;gap:36px}}
.postcard{margin:0 auto;min-width:0;width:100%;max-width:600px;background:var(--paper);padding:9px 9px 2px;border-radius:6px;box-shadow:0 1px 0 var(--line),0 20px 40px -22px var(--shadow)}
.board{--n:4;position:relative;width:100%;max-width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--well);border-radius:2px;user-select:none;-webkit-user-select:none}
.caption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px 9px}
.caption .names{display:grid;min-width:0}
.caption strong{font:800 1.45rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.caption .sub{color:var(--muted);font-size:.85rem;margin-top:3px}
.stamp{flex:0 0 auto;font:500 .85rem/1 var(--f-mono);color:var(--muted);border:1.5px dashed var(--line);border-radius:3px;padding:.5rem .55rem}

/* Tiles */
.tile{position:absolute;top:0;left:0;width:calc(100% / var(--n));height:calc(100% / var(--n));margin:0;padding:0;border:0;border-radius:0;background-color:var(--well);background-image:var(--img);background-size:calc(var(--n) * 100%) calc(var(--n) * 100%);background-repeat:no-repeat;box-shadow:inset 0 0 0 1px var(--seam);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .24s cubic-bezier(.2,.8,.2,1),scale .18s ease,box-shadow .6s ease,filter .15s}
.mode-swap .tile{touch-action:none;cursor:grab}
.instant .tile{transition:none!important}
.tile.moving{z-index:2}
.tile.sel{z-index:3;scale:.9;box-shadow:inset 0 0 0 3px var(--accent),0 10px 22px rgba(0,0,0,.45)}
.tile.dragging{z-index:5;scale:1.06;cursor:grabbing;transition:scale .15s ease,box-shadow .2s;box-shadow:inset 0 0 0 2px var(--accent),0 16px 30px rgba(0,0,0,.5)}
.tile.target{filter:brightness(1.22);box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;z-index:4}
.tile.nope{animation:nope .3s}
.tile.appear{animation:appear .8s ease both}
.show-ok .tile.ok::after{content:"";position:absolute;top:7%;left:7%;width:max(9px,14%);aspect-ratio:1;border-radius:50%;background:var(--pine);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.num{position:absolute;right:6%;bottom:6%;display:none;padding:.2em .4em;border-radius:3px;background:rgba(8,14,18,.66);color:#fff;font:500 clamp(.6rem,2.6vw,.8rem)/1 var(--f-mono)}
.show-num .num{display:block}
.board.solved .tile{box-shadow:inset 0 0 0 0 rgba(255,255,255,0);cursor:default}
.board.solved .tile::after,.board.solved .num{display:none}
.board::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 62%);transform:translateX(-130%)}
.board.shine::after{animation:sweep 1.2s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes sweep{to{transform:translateX(130%)}}
@keyframes nope{25%{translate:-5px 0}50%{translate:4px 0}75%{translate:-2px 0}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

.ghost{position:absolute;inset:0;z-index:7;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:var(--img) center/cover no-repeat var(--well);cursor:pointer;animation:appear .2s ease}
.ghost span{background:rgba(8,14,18,.72);color:#fff;font-size:.8rem;padding:.35rem .75rem;border-radius:99px}

.win{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;display:grid;gap:4px;padding:14px 16px 16px;border-radius:6px;background:var(--glass);color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.win-kicker{margin:0;font:800 1.7rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.win-stats{margin:0;font:500 .95rem/1.4 var(--f-mono);color:var(--muted)}
.win-rec{margin:0;font-size:.85rem;font-weight:600;color:var(--pine)}
.win-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.win-actions .btn{flex:1 1 auto}

/* Panel */
.panel{display:grid;gap:18px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;align-items:center;gap:10px;background:var(--paper);border-radius:6px;padding:12px 12px 12px 16px;box-shadow:0 1px 0 var(--line)}
.stat{display:grid;gap:2px;min-width:0}
.stat small{font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat b{font:500 1.3rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.mini{width:52px;height:52px;border:0;padding:0;border-radius:4px;background:var(--img) center/cover no-repeat var(--well);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{border:0;margin:0;padding:0;min-width:0}
.field legend{padding:0;margin-bottom:8px;font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{display:grid;justify-items:center;align-content:center;gap:1px;min-height:48px;padding:.45rem .25rem;cursor:pointer;border-left:1px solid var(--line);text-align:center;transition:background .15s,color .15s}
.seg input:first-child + label{border-left:0}
.seg label b{font:500 .95rem/1.2 var(--f-mono)}
.seg label small{font-size:.7rem;opacity:.75}
.seg label:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.seg input:checked + label{background:var(--ink);color:var(--paper)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:-3px}
.seg.two{--cols:2}
.seg.two label{font-weight:600}
.help{margin:8px 0 0;color:var(--muted);font-size:.85rem;line-height:1.45}
.checks{display:grid;gap:10px}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:.92rem}
.check input{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:var(--pine)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:.72rem .9rem;font-weight:600;font-size:.95rem;line-height:1.2;cursor:pointer;transition:transform .1s,background .15s}
.btn:hover{background:color-mix(in srgb,var(--ink) 6%,var(--paper))}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,#000)}
.best{margin:0;font-size:.85rem;color:var(--muted)}
.best b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  .tile{transition:none}
  .board.shine::after{animation:none}
  .win,.ghost,.tile.appear,.tile.nope{animation:none}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <g class="m-ink">
        <rect x="0" y="0" width="10" height="10"/><rect x="12" y="0" width="10" height="10"/><rect x="24" y="0" width="10" height="10"/>
        <rect x="0" y="12" width="10" height="10"/><rect x="12" y="12" width="10" height="10"/><rect x="24" y="12" width="10" height="10"/>
        <rect x="0" y="24" width="10" height="10"/><rect x="12" y="24" width="10" height="10"/>
      </g>
      <rect class="m-acc" x="29" y="29" width="10" height="10"/>
    </svg>
    <div>
      <h1>Paysages en pièces</h1>
      <p>Chaque paysage est découpé en carrés puis mélangé. Remets les carrés à leur place pour le reconstituer.</p>
    </div>
  </header>

  <nav class="scenes" id="scenes" aria-label="Choisir un paysage">
    <input type="file" id="photo" accept="image/*" class="sr">
    <label for="photo" class="chip add" id="add-photo">
      <span class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <span id="add-label">Ta photo</span>
    </label>
  </nav>
  <p class="note" id="note" hidden></p>

  <main class="play">
    <figure class="postcard">
      <div class="board mode-swap" id="board" role="group" aria-label="Plateau du puzzle">
        <div class="ghost" id="ghost" hidden><span>Modèle · touche pour revenir au puzzle</span></div>
        <div class="win" id="win" hidden>
          <p class="win-kicker">Paysage reconstitué</p>
          <p class="win-stats" id="win-stats"></p>
          <p class="win-rec" id="win-rec" hidden>Nouveau record pour ce réglage</p>
          <div class="win-actions">
            <button type="button" class="btn" id="again">Rejouer</button>
            <button type="button" class="btn primary" id="next">Paysage suivant</button>
          </div>
        </div>
      </div>
      <figcaption class="caption">
        <div class="names"><strong id="cap-name">Lac Bleu</strong><span class="sub" id="cap-sub"></span></div>
        <span class="stamp" id="cap-size">4×4</span>
      </figcaption>
    </figure>

    <aside class="panel">
      <div class="stats">
        <div class="stat"><small>Coups</small><b id="moves">0</b></div>
        <div class="stat"><small>Temps</small><b id="time">0:00</b></div>
        <div class="stat"><small>En place</small><b id="placed">0/16</b></div>
        <button type="button" class="mini" id="mini" aria-label="Voir le modèle"></button>
      </div>

      <fieldset class="field">
        <legend>Découpage</legend>
        <div class="seg">
          <input type="radio" name="size" id="size-3" value="3" class="sr"><label for="size-3"><b>3×3</b><small>9 pièces</small></label>
          <input type="radio" name="size" id="size-4" value="4" class="sr" checked><label for="size-4"><b>4×4</b><small>16 pièces</small></label>
          <input type="radio" name="size" id="size-5" value="5" class="sr"><label for="size-5"><b>5×5</b><small>25 pièces</small></label>
          <input type="radio" name="size" id="size-6" value="6" class="sr"><label for="size-6"><b>6×6</b><small>36 pièces</small></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Mode de jeu</legend>
        <div class="seg two">
          <input type="radio" name="mode" id="mode-swap" value="swap" class="sr" checked><label for="mode-swap">Échanger</label>
          <input type="radio" name="mode" id="mode-slide" value="slide" class="sr"><label for="mode-slide">Taquin</label>
        </div>
        <p class="help" id="mode-help"></p>
      </fieldset>

      <fieldset class="field">
        <legend>Aides</legend>
        <div class="checks">
          <label class="check" for="opt-marks"><input type="checkbox" id="opt-marks">Signaler les pièces bien placées</label>
          <label class="check" for="opt-nums"><input type="checkbox" id="opt-nums">Afficher les numéros</label>
        </div>
      </fieldset>

      <div class="actions">
        <button type="button" class="btn primary" id="shuffle">Mélanger</button>
        <button type="button" class="btn" id="peek" aria-pressed="false">Voir le modèle</button>
      </div>
      <p class="best" id="best"></p>
    </aside>
  </main>
  <p class="sr" id="live" aria-live="polite"></p>
</div>

<script>
(() => {
/* ---------- Dessin des paysages ---------- */
const S = 1000;
const TAU = Math.PI * 2;

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function vgrad(ctx,y0,y1,stops){ const g=ctx.createLinearGradient(0,y0,0,y1); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function glow(ctx,x,y,rad,stops){ const g=ctx.createRadialGradient(x,y,0,x,y,rad); stops.forEach(([o,c])=>g.addColorStop(o,c)); ctx.fillStyle=g; ctx.fillRect(x-rad,y-rad,rad*2,rad*2); }
function disk(ctx,x,y,rad,col){ ctx.beginPath(); ctx.arc(x,y,rad,0,TAU); ctx.fillStyle=col; ctx.fill(); }
function haze(ctx,y0,y1,rgb,a){ const g=ctx.createLinearGradient(0,y0,0,y1); g.addColorStop(0,`rgba(${rgb},0)`); g.addColorStop(1,`rgba(${rgb},${a})`); ctx.fillStyle=g; ctx.fillRect(0,y0,S,y1-y0); }
function ridge(r,base,amp,peaks,levels,rough){
  let pts=[]; for(let i=0;i<=peaks;i++) pts.push(base+(r()-0.5)*amp);
  let d=amp*0.5;
  for(let l=0;l<levels;l++){ const nx=[]; for(let j=0;j<pts.length-1;j++){ nx.push(pts[j],(pts[j]+pts[j+1])/2+(r()-0.5)*d); } nx.push(pts[pts.length-1]); pts=nx; d*=rough; }
  return pts;
}
function wave(base,parts){ const pts=[]; for(let i=0;i<=200;i++){ const x=i/200; let y=base; parts.forEach(([a,f,p])=>{ y+=a*Math.sin(x*TAU*f+p); }); pts.push(y); } return pts; }
function pathBelow(ctx,pts){ ctx.beginPath(); ctx.moveTo(0,S); pts.forEach((y,i)=>ctx.lineTo(i/(pts.length-1)*S,y)); ctx.lineTo(S,S); ctx.closePath(); }
function fillBelow(ctx,pts,fill){ pathBelow(ctx,pts); ctx.fillStyle=fill; ctx.fill(); }
function strokeCrest(ctx,pts,col,w){ ctx.beginPath(); pts.forEach((y,i)=>ctx.lineTo(i/(pts.length-1)*S,y)); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.stroke(); }
function yAt(pts,x){ const f=Math.max(0,Math.min(1,x/S))*(pts.length-1); const i=Math.min(pts.length-2,Math.floor(f)); const t=f-i; return pts[i]*(1-t)+pts[i+1]*t; }
function snowCap(ctx,pts,line,col){ const n=pts.length; ctx.beginPath(); for(let i=0;i<n;i++) ctx.lineTo(i/(n-1)*S,pts[i]); for(let i=n-1;i>=0;i--){ const j=line+S*0.018*Math.sin(i*0.21)+S*0.011*Math.sin(i*0.63+1.3); ctx.lineTo(i/(n-1)*S,Math.max(pts[i],j)); } ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
function pine(ctx,x,y,h,col){ ctx.fillStyle=col; ctx.fillRect(x-h*0.03,y-h*0.14,h*0.06,h*0.16); ctx.beginPath(); for(let k=0;k<4;k++){ const top=y-h+k*h*0.2, bot=top+h*0.36, hw=h*(0.12+k*0.07); ctx.moveTo(x,top); ctx.lineTo(x-hw,bot); ctx.lineTo(x+hw,bot); ctx.closePath(); } ctx.fill(); }
function cloud(ctx,x,y,s,col,shade){ const puffs=[[0,0,1],[0.95,0.2,0.72],[-0.95,0.22,0.68],[0.45,-0.42,0.78],[-0.4,-0.3,0.66],[1.7,0.38,0.45],[-1.7,0.4,0.42]]; ctx.fillStyle=shade; puffs.forEach(([dx,dy,k])=>{ ctx.beginPath(); ctx.arc(x+dx*s,y+dy*s+s*0.14,k*s,0,TAU); ctx.fill(); }); ctx.fillStyle=col; puffs.forEach(([dx,dy,k])=>{ ctx.beginPath(); ctx.arc(x+dx*s,y+dy*s,k*s*0.97,0,TAU); ctx.fill(); }); }
function bird(ctx,x,y,s,col){ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,s*0.16); ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x-s,y-s*0.25); ctx.quadraticCurveTo(x-s*0.45,y-s*0.6,x,y); ctx.quadraticCurveTo(x+s*0.45,y-s*0.6,x+s,y-s*0.25); ctx.stroke(); }
function reflect(ctx,h){ const tmp=document.createElement('canvas'); tmp.width=S; tmp.height=S; tmp.getContext('2d').drawImage(ctx.canvas,0,0); ctx.save(); ctx.beginPath(); ctx.rect(0,h,S,S-h); ctx.clip(); ctx.translate(0,2*h); ctx.scale(1,-1); ctx.globalAlpha=0.75; ctx.filter='blur(2px)'; ctx.drawImage(tmp,0,0); ctx.restore(); }
function ripples(ctx,r,h,count,tpl){ ctx.lineCap='round'; for(let i=0;i<count;i++){ const t=r(); const y=h+t*t*(S-h)+2; const len=S*(0.01+t*0.07)*(0.5+r()); const x=r()*S; ctx.strokeStyle=tpl.replace('A',(0.12+t*0.25).toFixed(2)); ctx.lineWidth=1+t*2.5; ctx.beginPath(); ctx.moveTo(x-len/2,y); ctx.lineTo(x+len/2,y); ctx.stroke(); } }

/* ---------- Jeu ---------- */
const $ = s => document.querySelector(s);
const app=$('#app'), board=$('#board'), ghost=$('#ghost'), winCard=$('#win'), live=$('#live'), chipsEl=$('#scenes');

const scenes=[
  {key:'lac', name:'Lac Bleu', sub:"Lac d'altitude au lever du soleil", draw:sceneLac},
  {key:'cote', name:'Côte Sauvage', sub:'Falaise et phare, marée montante', draw:sceneCote},
  {key:'erg', name:'Grand Erg', sub:'Dunes au coucher du soleil', draw:sceneErg},
  {key:'refuge', name:'Refuge du Col', sub:'Nuit claire sous les étoiles', draw:sceneRefuge},
  {key:'toscane', name:'Collines de Toscane', sub:'Champs et cyprès au matin', draw:sceneToscane}
];
const BUILTIN=scenes.length;

const state={scene:0,n:4,mode:'swap',order:[],slotOf:[],moves:0,base:0,started:0,running:false,solved:false,sel:null,marks:false,nums:false};
let tiles=[], drag=null, justDragged=false;

function makeChip(i){
  const sc=scenes[i];
  const b=document.createElement('button'); b.type='button'; b.className='chip'; b.setAttribute('aria-pressed','false');
  const cv=document.createElement('canvas'); cv.width=cv.height=128; b.append(cv);
  const sp=document.createElement('span'); sp.textContent=sc.name; b.append(sp);
  b.addEventListener('click',()=>selectScene(i));
  chipsEl.insertBefore(b,$('#photo'));
  sc.chip=b; sc.thumb=cv;
}
function finishImage(i,c){ const sc=scenes[i]; sc.url=c.toDataURL('image/jpeg',0.88); sc.thumb.getContext('2d').drawImage(c,0,0,128,128); }
function ensureImage(i){
  const sc=scenes[i]; if(sc.url) return sc.url;
  const c=document.createElement('canvas'); c.width=c.height=S; const ctx=c.getContext('2d');
  sc.draw(ctx); grain(ctx,9); finishImage(i,c); return sc.url;
}
function paintRest(){ const i=scenes.findIndex(s=>!s.url&&s.draw); if(i<0) return; ensureImage(i); setTimeout(paintRest,40); }

function fmt(sec){ sec=Math.max(0,Math.floor(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function elapsed(){ return state.base+(state.running?(performance.now()-state.started)/1000:0); }
function startTimer(){ state.started=performance.now(); state.running=true; }
function stopTimer(){ state.base=elapsed(); state.running=false; }
setInterval(()=>{ if(state.running) $('#time').textContent=fmt(elapsed()); },500);

function neighbors(s,n){ const r=Math.floor(s/n), c=s%n, out=[]; if(r>0) out.push(s-n); if(r<n-1) out.push(s+n); if(c>0) out.push(s-1); if(c<n-1) out.push(s+1); return out; }
function isSolved(o){ return o.every((t,i)=>t===i); }
function shuffled(n,mode){
  const N=n*n, o=[...Array(N).keys()];
  if(mode==='swap'){
    let tries=0;
    do{ for(let i=N-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } tries++; }
    while(o.filter((t,i)=>t===i).length>Math.floor(N/10) && tries<80);
    return o;
  }
  let g=N-1, prev=-1; const steps=N*N*2+60;
  for(let k=0;k<steps||isSolved(o);k++){ const nb=neighbors(g,n).filter(x=>x!==prev); const p=nb[Math.floor(Math.random()*nb.length)]; [o[g],o[p]]=[o[p],o[g]]; prev=g; g=p; }
  return o;
}

function selectScene(i,restore){
  state.scene=i;
  scenes.forEach((s,k)=>s.chip&&s.chip.setAttribute('aria-pressed',String(k===i)));
  newGame(restore);
  scenes[i].chip?.scrollIntoView({block:'nearest',inline:'nearest'});
}

function newGame(restore){
  const n=state.n, N=n*n, sc=scenes[state.scene];
  app.style.setProperty('--img',`url("${ensureImage(state.scene)}")`);
  $('#cap-name').textContent=sc.name; $('#cap-sub').textContent=sc.sub; $('#cap-size').textContent=`${n}×${n}`;
  const valid=restore && Array.isArray(restore.order) && restore.order.length===N && !isSolved(restore.order);
  state.order=valid?restore.order.slice():shuffled(n,state.mode);
  state.moves=valid?(restore.moves||0):0; state.base=valid?(restore.elapsed||0):0;
  state.running=false; state.solved=false; state.sel=null;
  board.classList.remove('solved','shine'); board.classList.toggle('mode-swap',state.mode==='swap');
  winCard.hidden=true; showGhost(false); live.textContent='';
  build(); updateBest();
  $('#time').textContent=fmt(state.base);
}

function build(){
  const n=state.n, N=n*n;
  tiles.forEach(t=>t.remove()); tiles=[];
  board.style.setProperty('--n',n);
  for(let id=0;id<N;id++){
    const b=document.createElement('button'); b.type='button'; b.className='tile'; b.dataset.id=id;
    const r=Math.floor(id/n), c=id%n;
    b.style.backgroundPosition=`${c/(n-1)*100}% ${r/(n-1)*100}%`;
    b.innerHTML=`<span class="num">${id+1}</span>`;
    b.setAttribute('aria-label',`Pièce ${id+1}`);
    if(state.mode==='slide'&&id===N-1){ b.classList.add('blank'); b.hidden=true; b.tabIndex=-1; }
    b.addEventListener('click',onTileClick);
    b.addEventListener('pointerdown',onDown); b.addEventListener('pointermove',onMove);
    b.addEventListener('pointerup',onUp); b.addEventListener('pointercancel',onUp);
    board.insertBefore(b,ghost); tiles.push(b);
  }
  board.classList.add('instant'); refresh(); void board.offsetWidth; board.classList.remove('instant');
}

function refresh(){
  const n=state.n, N=n*n; const slotOf=new Array(N); state.order.forEach((id,slot)=>{ slotOf[id]=slot; }); state.slotOf=slotOf;
  let ok=0; const total=state.mode==='slide'?N-1:N;
  tiles.forEach((el,id)=>{
    const s=slotOf[id];
    if(!el.classList.contains('dragging')) el.style.transform=`translate(${(s%n)*100}%, ${Math.floor(s/n)*100}%)`;
    const good=s===id; el.classList.toggle('ok',good); if(good&&!el.classList.contains('blank')) ok++;
    el.classList.toggle('sel',state.sel===id);
  });
  $('#moves').textContent=state.moves; $('#placed').textContent=`${ok}/${total}`;
}

function flagMoving(ids){ ids.forEach(id=>tiles[id].classList.add('moving')); setTimeout(()=>ids.forEach(id=>tiles[id]&&tiles[id].classList.remove('moving')),280); }
function afterMove(k){ state.moves+=k; if(!state.running) startTimer(); refresh(); if(isSolved(state.order)) win(); }
function doSwap(a,b){ const o=state.order; [o[a],o[b]]=[o[b],o[a]]; flagMoving([o[a],o[b]]); afterMove(1); }
function slideFrom(s){
  const n=state.n, blank=n*n-1; let g=state.order.indexOf(blank); if(s===g) return false;
  const sr=Math.floor(s/n), sc=s%n, gr=Math.floor(g/n), gc=g%n; let dir;
  if(sr===gr) dir=sc>gc?1:-1; else if(sc===gc) dir=sr>gr?n:-n; else return false;
  const moved=[]; let k=0;
  while(g!==s){ const nx=g+dir; state.order[g]=state.order[nx]; state.order[nx]=blank; moved.push(state.order[g]); g=nx; k++; }
  flagMoving(moved); afterMove(k); return true;
}
function nope(el){ el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); setTimeout(()=>el.classList.remove('nope'),320); }

function onTileClick(e){
  if(justDragged||state.solved) return;
  const el=e.currentTarget, id=+el.dataset.id, slot=state.slotOf[id];
  if(state.mode==='slide'){ if(!slideFrom(slot)) nope(el); return; }
  if(state.sel===null){ state.sel=id; refresh(); return; }
  if(state.sel===id){ state.sel=null; refresh(); return; }
  const a=state.slotOf[state.sel]; state.sel=null; doSwap(a,slot);
}
function slotAt(x,y){ const rc=board.getBoundingClientRect(), n=state.n; if(x<rc.left||x>rc.right||y<rc.top||y>rc.bottom) return null; const c=Math.min(n-1,Math.floor((x-rc.left)/rc.width*n)), r=Math.min(n-1,Math.floor((y-rc.top)/rc.height*n)); return r*n+c; }
function onDown(e){
  if(state.mode!=='swap'||state.solved) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  const el=e.currentTarget; drag={el,id:+el.dataset.id,x0:e.clientX,y0:e.clientY,moved:false,pid:e.pointerId,target:null};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
}
function onMove(e){
  if(!drag||e.pointerId!==drag.pid) return;
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!drag.moved){ if(Math.hypot(dx,dy)<7) return; drag.moved=true; state.sel=null; refresh(); drag.el.classList.add('dragging'); }
  const s=state.slotOf[drag.id], n=state.n;
  drag.el.style.transform=`translate(calc(${(s%n)*100}% + ${dx}px), calc(${Math.floor(s/n)*100}% + ${dy}px))`;
  const t=slotAt(e.clientX,e.clientY); const tid=t===null?null:state.order[t]; const next=(tid!==null&&tid!==drag.id)?tid:null;
  if(drag.target!==next){ if(drag.target!==null) tiles[drag.target].classList.remove('target'); if(next!==null) tiles[next].classList.add('target'); drag.target=next; }
}
function onUp(e){
  if(!drag||e.pointerId!==drag.pid) return;
  const d=drag; drag=null;
  if(d.target!==null) tiles[d.target].classList.remove('target');
  if(!d.moved) return;
  justDragged=true; setTimeout(()=>{ justDragged=false; },60);
  d.el.classList.remove('dragging');
  const t=e.type==='pointerup'?slotAt(e.clientX,e.clientY):null; const from=state.slotOf[d.id];
  if(t!==null&&t!==from) doSwap(from,t); else refresh();
}
document.addEventListener('keydown',e=>{
  if(state.mode!=='slide'||state.solved) return;
  const n=state.n; const k={ArrowLeft:1,ArrowRight:-1,ArrowUp:n,ArrowDown:-n}[e.key]; if(k===undefined) return;
  const ae=document.activeElement; if(!(ae===document.body||board.contains(ae))) return;
  e.preventDefault();
  const g=state.order.indexOf(n*n-1), s=g+k; if(s<0||s>=n*n) return;
  if(Math.abs(k)===1&&Math.floor(s/n)!==Math.floor(g/n)) return;
  slideFrom(s);
});

function bestKey(){ const sc=scenes[state.scene]; return sc.key==='photo'?null:`paysages-en-pieces:${sc.key}:${state.n}:${state.mode}`; }
function readBest(){ const k=bestKey(); if(!k) return null; try{ return JSON.parse(localStorage.getItem(k)); }catch(err){ return null; } }
function updateBest(){
  const el=$('#best'); const label=`${state.n}×${state.n} en mode ${state.mode==='swap'?'échange':'taquin'}`;
  if(!bestKey()){ el.textContent='Les records ne sont pas gardés pour tes photos.'; return; }
  const b=readBest();
  el.innerHTML=b?`Record ${label} : <b>${b.moves} coups</b> en <b>${fmt(b.time)}</b>`:`Pas encore de record ${label}.`;
}
function saveBest(){
  const k=bestKey(); if(!k) return false;
  const cur={moves:state.moves,time:Math.round(state.base)}, b=readBest();
  const better=!b||cur.moves<b.moves||(cur.moves===b.moves&&cur.time<b.time);
  if(better){ try{ localStorage.setItem(k,JSON.stringify(cur)); }catch(err){} }
  updateBest(); return better;
}

function win(){
  stopTimer(); state.solved=true; state.sel=null; refresh();
  $('#time').textContent=fmt(state.base);
  const blank=tiles.find(t=>t.classList.contains('blank')); if(blank){ blank.hidden=false; blank.classList.add('appear'); }
  board.classList.add('solved');
  const rec=saveBest();
  setTimeout(()=>board.classList.add('shine'),450);
  setTimeout(()=>{ if(!state.solved) return; $('#win-stats').textContent=`${state.moves} coups · ${fmt(state.base)} · ${state.n}×${state.n}`; $('#win-rec').hidden=!rec; winCard.hidden=false; },1150);
  live.textContent=`Paysage reconstitué en ${state.moves} coups et ${fmt(state.base)}.`;
}

function showGhost(on){ ghost.hidden=!on; const p=$('#peek'); p.setAttribute('aria-pressed',String(on)); p.textContent=on?'Masquer le modèle':'Voir le modèle'; }
ghost.addEventListener('click',()=>showGhost(false));
$('#peek').addEventListener('click',()=>showGhost(ghost.hidden));
$('#mini').addEventListener('click',()=>showGhost(ghost.hidden));
$('#shuffle').addEventListener('click',()=>newGame());
$('#again').addEventListener('click',()=>newGame());
$('#next').addEventListener('click',()=>selectScene((state.scene+1)%scenes.length));

const helpText={swap:'Touche deux carrés pour les échanger, ou fais glisser un carré sur un autre.',slide:'Une case est vide : touche un carré aligné avec elle pour le faire glisser. Au clavier, utilise les flèches.'};
document.querySelectorAll('input[name="size"]').forEach(inp=>inp.addEventListener('change',()=>{ state.n=+inp.value; newGame(); }));
document.querySelectorAll('input[name="mode"]').forEach(inp=>inp.addEventListener('change',()=>{ state.mode=inp.value; $('#mode-help').textContent=helpText[state.mode]; newGame(); }));
$('#opt-marks').addEventListener('change',e=>{ state.marks=e.target.checked; board.classList.toggle('show-ok',state.marks); });
$('#opt-nums').addEventListener('change',e=>{ state.nums=e.target.checked; board.classList.toggle('show-num',state.nums); });

$('#photo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const note=$('#note'); note.hidden=true;
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=S; const ctx=c.getContext('2d');
      const m=Math.min(img.naturalWidth,img.naturalHeight);
      ctx.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S,S);
      let i=scenes.findIndex(s=>s.key==='photo');
      if(i<0){ scenes.push({key:'photo',name:'Ta photo',sub:''}); i=scenes.length-1; makeChip(i); $('#add-label').textContent='Autre photo'; }
      scenes[i].sub=(f.name||'Image importée').replace(/\.[^.]+$/,'').slice(0,40);
      finishImage(i,c); selectScene(i);
    };
    img.onerror=()=>{ note.textContent="Cette image n'a pas pu être ouverte. Essaie avec un fichier JPG ou PNG."; note.hidden=false; };
    img.src=fr.result;
  };
  fr.onerror=()=>{ note.textContent="Le fichier n'a pas pu être lu. Essaie avec une autre image."; note.hidden=false; };
  fr.readAsDataURL(f);
});

function snapshot(){
  const builtin=state.scene<BUILTIN;
  return {scene:builtin?state.scene:0,n:state.n,mode:state.mode,order:builtin&&!state.solved?state.order.slice():null,moves:state.moves,elapsed:elapsed(),marks:state.marks,nums:state.nums};
}
function start(data){
  data=data||{};
  if([3,4,5,6].includes(data.n)) state.n=data.n;
  if(data.mode==='swap'||data.mode==='slide') state.mode=data.mode;
  state.marks=!!data.marks; state.nums=!!data.nums;
  $(`#size-${state.n}`).checked=true; $(`#mode-${state.mode}`).checked=true;
  $('#opt-marks').checked=state.marks; $('#opt-nums').checked=state.nums;
  board.classList.toggle('show-ok',state.marks); board.classList.toggle('show-num',state.nums);
  $('#mode-help').textContent=helpText[state.mode];
  for(let i=0;i<BUILTIN;i++) makeChip(i);
  const sceneIdx=Number.isInteger(data.scene)&&data.scene>=0&&data.scene<BUILTIN?data.scene:0;
  selectScene(sceneIdx,data.order?data:null);
  setTimeout(paintRest,60);
}
try{ window.claude?.hot?.snapshot?.(snapshot); }catch(err){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
